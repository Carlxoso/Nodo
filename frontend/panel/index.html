<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NODO · Centro de operaciones</title>
  <meta name="theme-color" content="#0E5C73">
  <link rel="icon" href="/compartido/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/ciudadano/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/ciudadano/icon-192.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/compartido/base.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="barra">
    <span class="logo">
      <svg class="ic marca" aria-hidden="true" viewBox="0 0 32 32"><use href="/compartido/iconos.svg#marca"></use></svg>
      NODO <span class="sub"><svg class="ic" aria-hidden="true"><use href="/compartido/iconos.svg#centro"></use></svg>Centro de operaciones</span>
    </span>
    <p class="aviso">Apoyo a la decisión. No reemplaza al COE ni al 911.</p>
    <button id="btn-escenario" class="btn" hidden>
      <svg class="ic" aria-hidden="true"><use href="/compartido/iconos.svg#reloj"></use></svg>Jueves 06:00
    </button>
    <button id="btn-sonido" class="btn-sec" type="button" aria-label="Sonido de avisos" aria-pressed="true" title="Sonido de avisos">
      <svg class="ic" aria-hidden="true"><use href="/compartido/iconos.svg#sonido"></use></svg><span>Sonido</span>
    </button>
    <button id="btn-informe" class="btn-sec" hidden>
      <svg class="ic" aria-hidden="true"><use href="/compartido/iconos.svg#informe"></use></svg>Informe COE
    </button>
    <span id="estado" class="chip" role="status">Conectando…</span>
    <span id="usuario" class="usuario"></span>
    <button id="salir" class="btn-sec salir" hidden>
      <svg class="ic" aria-hidden="true"><use href="/compartido/iconos.svg#salir"></use></svg>Salir
    </button>
  </header>

  <div id="login" class="login" hidden>
    <form id="form-login">
      <span class="logo">
        <svg class="ic marca" aria-hidden="true" viewBox="0 0 32 32"><use href="/compartido/iconos.svg#marca"></use></svg>
        NODO
      </span>
      <h2>Ingreso al panel</h2>
      <p class="sec">Solo para el personal del centro de operaciones.</p>
      <label>Correo <input type="email" id="l-email" required autocomplete="username"></label>
      <label>Contraseña <input type="password" id="l-pass" required autocomplete="current-password"></label>
      <p id="l-error" class="error" role="alert"></p>
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>

  <main>
    <aside id="lateral">
      <div class="tabs" role="tablist" data-activa="casos">
        <button role="tab" id="tab-casos" aria-selected="true">Casos</button>
        <button role="tab" id="tab-tablero" aria-selected="false">Tablero</button>
      </div>
      <div id="vista-casos">
        <div id="resumen" class="resumen" aria-label="Casos abiertos por prioridad"></div>
        <h2>Casos por prioridad</h2>
        <ul id="lista" class="casos"></ul>
        <details id="atendidos" class="atendidos" hidden>
          <summary>Atendidos <span id="n-atendidos" class="num">0</span></summary>
          <ul id="lista-atendidos" class="casos-min"></ul>
        </details>
      </div>
      <div id="vista-tablero" hidden></div>
    </aside>
    <div id="mapa" aria-label="Mapa de Esmeraldas con incidentes"></div>
  </main>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="panel.js"></script>
</body>
</html>
